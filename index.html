<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs - Workspace</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #09090b; 
            color: #fafafa; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { width: 100%; max-width: 500px; text-align: center; padding: 20px; }
        h1 { 
            font-size: 2.8rem; font-weight: 800; margin-bottom: 20px; 
            background: linear-gradient(to right, #a855f7, #6366f1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .search-box { position: relative; display: flex; align-items: center; }
        input { 
            width: 100%; padding: 16px 25px; background: #18181b; 
            border: 1px solid #27272a; color: #fff; border-radius: 50px; 
            font-size: 16px; outline: none; 
        }
        input:focus { border-color: #6366f1; }
        button { 
            position: absolute; right: 6px; padding: 11px 25px; 
            border: none; background: #6366f1; color: white; 
            border-radius: 50px; cursor: pointer; font-weight: bold; 
        }
        button:hover { background: #4f46e5; }
        .hint { color: #71717a; margin-top: 15px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Web Browser</h1>
        <form id="proxy-gate">
            <div class="search-box">
                <input id="target-query" type="text" placeholder="Search Google or enter URL..." required autocomplete="off">
                <button type="submit">Launch</button>
            </div>
        </form>
        <div class="hint">Routes traffic through secure public network worker nodes.</div>
    </div>

    <!-- Core Scramjet network execution dependencies -->
    <script src="https://jsdelivr.net"></script>
    
    <script>
        // CENTRAL PROXY ROUTER CONFIGURATION
        window.__scramjet$config = {
            prefix: '/uv/service/',
            encodeUrl: function(url) {
                if (!url) return url;
                return encodeURIComponent(url.split('').map((char, i) => i % 2 ? String.fromCharCode(char.charCodeAt(0) ^ 2) : char).join(''));
            },
            decodeUrl: function(url) {
                if (!url) return url;
                return decodeURIComponent(url).split('').map((char, i) => i % 2 ? String.fromCharCode(char.charCodeAt(0) ^ 2) : char).join('');
            },
            // ACTIVE PUBLIC ROUTING NETWORK SERVER
            // If connection fails, replace this link with another live public bare node.
            bare: 'https://proudsmartchain.com' 
        };

        const form = document.getElementById('proxy-gate');
        const input = document.getElementById('target-query');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            let query = input.value.trim();
            
            // Format input text string to a valid URL pattern
            if (!/^https?:\/\//i.test(query)) {
                if (query.includes('.') && !query.includes(' ')) {
                    query = 'https://' + query;
                } else {
                    query = 'https://google.com' + encodeURIComponent(query);
                }
            }

            // Scramble target path using the built-in encoding algorithm
            const proxiedEndpoint = window.__scramjet$config.prefix + window.__scramjet$config.encodeUrl(query);

            // Construct an isolated document container to run the background service worker
            const payloadDocument = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Workspace View</title>
                    <style>html,body,iframe{width:100%;height:100%;margin:0;padding:0;border:none;overflow:hidden;background:#000;}</style>
                </head>
                <body>
                    <iframe src="${proxiedEndpoint}"></iframe>
                    <script src="https://jsdelivr.net"><\/script>
                    <script>
                        if ('serviceWorker' in navigator) {
                            navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent("importScripts('https://jsdelivr.net');const sw=new ScramjetServiceWorker();self.addEventListener('fetch',e=>e.respondWith(sw.fetch(e)));"), { scope: '${window.__scramjet$config.prefix}' });
                        }
                    <\/script>
                </body>
                </html>
            `;

            // Pack the execution logic into an encrypted base64 payload data string
            const base64Data = btoa(unescape(encodeURIComponent(payloadDocument)));
            const dataUrl = 'data:text/html;base64,' + base64Data;

            // Trigger window breakout natively
            const proxyWindow = window.open();
            if (proxyWindow) {
                proxyWindow.document.write(`<iframe src="${dataUrl}" style="width:100vw;height:100vh;border:none;margin:0;padding:0;overflow:hidden;"></iframe>`);
                proxyWindow.document.close();
            } else {
                alert("Popup Blocked! Please click the popup icon in your address bar and allow popups to continue.");
            }
        });
    </script>
</body>
</html>
